<rect width="1440" height="1296" rx="20" fill="#111A20"/>
<g font-family="'JetBrains Mono', Consolas, 'Liberation Mono', monospace">
<text x="40" y="53" font-size="28" fill="#FFB547" font-weight="700" text-anchor="start">&gt; AGENT SDK</text>
<text x="40" y="87" font-size="22" fill="#E4ECE7" font-weight="400" text-anchor="start">Starlark-defined agents on one Go ReAct loop</text>
