<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1296" viewBox="0 0 1440 1296" role="img" aria-labelledby="title desc">
<title id="title">Agent SDK package layers</title>
<desc id="desc">Six layers. Tools (craggy-agent CLI, examples/host, SQLite and YAML adapters) sit on agentcap, the capability bridge, which uses workflow, which uses host, the runtime. host uses the engine (loop, agentdef, openrouter), which uses foundations (model, transcript, config, trace, memory, defs). External: foundation-kit, script-services, capability-services.</desc>
